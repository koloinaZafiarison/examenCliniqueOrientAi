services:
  api:
    build: .
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [qdrant, postgres]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orientai
      POSTGRES_PASSWORD: orientai
      POSTGRES_DB: orientai
    ports: ["5432:5432"]